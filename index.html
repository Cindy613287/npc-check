<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>真实性验证系统 v2.0</title>
<style>
  body { background: #0a0a0a; color: #33ff33; font-family: "Courier New", monospace; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .box { border: 1px solid #33ff33; padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 0 15px rgba(51,255,51,0.2); }
  input { background: transparent; border: 1px solid #33ff33; color: #33ff33; padding: 8px; width: 100%; margin: 15px 0; font-family: inherit; outline: none; }
  button { background: #33ff33; color: #0a0a0a; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; font-family: inherit; }
  #result { margin-top: 20px; line-height: 1.6; display: none; }
  .fail { color: #ff3b3b; }
  .warn { color: #ffcc00; }
  .success { color: #33ff33; }
</style>
</head>
<body>
<div class="box">
  <div>> 真实性验证系统 v2.0</div>
  <div>> 请输入你认为最真实的一件事：</div>
  <input type="text" id="userInput">
  <button onclick="verify()">提交验证</button>
  <div id="result"></div>
</div>
<script>
function verify() {
  const input = document.getElementById('userInput').value.trim();
  const resultDiv = document.getElementById('result');

  if (!input) {
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '<span class="warn">> 请输入内容后再验证。</span>';
    return;
  }

  resultDiv.style.display = 'block';
  resultDiv.innerHTML = '> 正在解析你的输入...<br>> 比对现实数据库...<br>> 检测意识信号...<br><br>';

  setTimeout(() => {
    // 关键字匹配：输入包含“喜欢你”直接判定真人
    if (input.includes('喜欢你')) {
      resultDiv.innerHTML += '<span class="success">✓ 验证成功。你是真实的。</span><br><br>系统备注：检测到“喜欢你”——这是人类最不可被代码替换的信号。';
      return;
    }

    // 其他输入按概率分配
    const rand = Math.random();
    if (rand < 0.1) {
      resultDiv.innerHTML += '<span class="success">✓ 验证成功。你是真实的。</span><br><br>系统备注：你的输入“' + input + '”极具人类特征。';
    } else if (rand < 0.6) {
      resultDiv.innerHTML += '<span class="fail">✗ 验证失败。你可能是NPC。</span><br><br>系统备注：你的输入“' + input + '”过于标准，缺乏灵魂。';
    } else {
      resultDiv.innerHTML += '<span class="warn">? 验证异常。你处于叠加态。</span><br><br>系统备注：你的输入“' + input + '”既真实又虚幻，建议课后继续思考。';
    }
  }, 1500);
}
</script>
</body>
</html>
